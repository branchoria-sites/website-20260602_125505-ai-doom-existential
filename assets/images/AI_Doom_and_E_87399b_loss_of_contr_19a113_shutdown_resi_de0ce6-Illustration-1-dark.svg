    --art-sheen: #ffffff;
    --art-sheen-opacity: 0.18;
    --art-shadow: #000000;
    --art-shadow-opacity: 0.28;
    --art-muted-line: #64748b;
    --art-panel-tint: #1e293b;
    --accent-1: #93c5fd;
    --accent-2: #86efac;
    --accent-3: #fcd34d;
    --accent-4: #f9a8d4;
    --accent-5: #c4b5fd;
    --accent-6: #a5f3fc;
}
:root[data-theme="light"] {
    --background: #f8fafc;
    --panel: #ffffff;
    --primary-text: #0f172a;
    --muted-text: #64748b;
    --inverse-text: #ffffff;
